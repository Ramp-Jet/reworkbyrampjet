  @font-face{
    font-family:'Archivo';

    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face{
    font-family:'IBM Plex Sans';
    font-style:normal;
    font-weight:400 600;
    font-display:swap;
    src:url(fonts/ibm-plex-sans-var-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face{
    font-family:'IBM Plex Mono';
    font-style:normal;
    font-weight:400;
    font-display:swap;
    src:url(fonts/ibm-plex-mono-400-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root{
    --steel:#0E1013; --seam:#48515A; --zinc:#9AA3AB;
    --paper:#F9F6F1; --orange:#F26B1D;
    --display:"Archivo",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--steel);color:var(--paper);font-family:var(--body);
    min-height:100vh;display:flex;flex-direction:column;
    padding:40px 24px;
  }
  .wrap{width:100%;max-width:680px;margin:auto}
  .logo{display:block;width:190px;margin-bottom:52px}
  .logo svg{width:100%;height:auto;display:block}
  .spec{
    font-family:var(--mono);font-size:0.6875rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--orange);margin-bottom:18px;
  }
  h1{
    font-family:var(--display);font-weight:900;font-stretch:88%;
    font-size:clamp(2.1rem,6vw,3.25rem);line-height:1.03;
    letter-spacing:-.015em;margin-bottom:20px;
  }
  p{color:var(--zinc);font-size:1.0625rem;line-height:1.6;max-width:52ch}
  p + p{margin-top:14px}
  .back{
    display:inline-flex;align-items:center;gap:10px;margin-top:40px;
    background:var(--orange);color:var(--steel);text-decoration:none;
    font-family:var(--display);font-weight:800;font-stretch:90%;
    font-size:0.9375rem;letter-spacing:.02em;text-transform:uppercase;
    padding:14px 22px;transition:background .15s;
  }
  .back:hover{background:#FF7F35}
  .back svg{width:16px;height:16px}
</style>
</head>
